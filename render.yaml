# Render — El Juego del Dinero (blog)
# Plan gratuito (Web Service). El servicio se duerme tras ~15 min sin
# tráfico: la primera visita tras el reposo tarda ~30-60 s en despertar.
services:
  - type: web
    name: el-juego-del-dinero-blog
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SITE_URL
        value: https://18puro.com
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PUBLISH_KEY
        sync: false
